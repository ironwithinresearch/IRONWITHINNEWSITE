<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<title>You're offline | Iron Within Research</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#020617;color:#EAFBFF;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;text-align:center}
img{width:72px;height:72px;border-radius:18px;margin-bottom:18px}

button{min-height:48px;padding:0 24px;border:0;border-radius:12px;font:inherit;font-weight:800;color:#04121a;background:linear-gradient(135deg,#00CFFF,#7C3AED);cursor:pointer}

small{display:block;margin-top:34px;color:#64748b;font-size:.78rem}

<body>
<main>
  <img src="/logo-mark.png" alt="" width="72" height="72">

  <p>The shop needs an internet connection to show live prices and stock. Check your connection and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <small>For research use only. Not for human or veterinary use.</small>
